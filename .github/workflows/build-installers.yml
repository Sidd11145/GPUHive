name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install ".[build]"

      - name: Build standalone binary
        run: pyinstaller packaging/gridgpu.spec

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # ---------- Windows: Inno Setup wizard ----------
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.version.outputs.value }}
          packaging\windows\gridgpu.iss

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GPUHive-Windows
          path: dist/GPUHive-Setup-*.exe

      # ---------- macOS: .pkg ----------
      - name: Build macOS pkg
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-pkg.sh "${{ steps.version.outputs.value }}"

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: GPUHive-macOS
          path: dist/GPUHive-*.pkg

      # ---------- Linux: tarball with binary + install script ----------
      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          STAGE="gridgpu-${VERSION}-linux-x86_64"
          mkdir -p "dist/${STAGE}"
          cp dist/gridgpu "dist/${STAGE}/gridgpu"
          cp packaging/linux/install-linux.sh "dist/${STAGE}/install-linux.sh"
          chmod +x "dist/${STAGE}/gridgpu" "dist/${STAGE}/install-linux.sh"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Upload Linux tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: GPUHive-Linux
          path: dist/gridgpu-*-linux-x86_64.tar.gz

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
